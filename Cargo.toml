[package]
name = "omega"
version = "0.1.0"
edition = "2024"

[dependencies]
mtp = { git = "https://git.methanium.net/Methanium/mtp.git",  features = [
    "crypto",
    "files",
    "web-server",
] }

ansi_term = "0.12.1"
base64 = "0.22.1"
bytes = "1"
dashmap = "6.2.1"
dotenv = "0.15.0"
http = "1"
once_cell = "1.21.4"
rand = "0.10.2"
rustls = { version = "0.23.42", default-features = false, features = [
    "std",
    "tls12",
    "aws-lc-rs",
    "prefer-post-quantum",
] }
sqlx = { version = "0.8.6", features = ["mysql", "runtime-tokio", "migrate"] }
tokio = { version = "*", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
uuid = { version = "1.24.0", features = ["v4", "v7"] }
thiserror = "2.0.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
